services:
  # 1. Base de données PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: oromall_db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${PGDATABASE:-marcheplus}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-marcheplus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    networks:
      - default

  # 2. Application Unifiée OroMall (Frontend React + Backend REST API + Base PostgreSQL)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oromall_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres_secure_pass_2026}
      PGDATABASE: ${PGDATABASE:-marcheplus}
      DATABASE_URL: postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres_secure_pass_2026}@postgres:5432/${PGDATABASE:-marcheplus}
      VITE_ADMIN_PIN: ${VITE_ADMIN_PIN:-Tecnodylan14@}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/server/data
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network

volumes:
  pgdata:
  app_data:

networks:
  dokploy-network:
    external: true


