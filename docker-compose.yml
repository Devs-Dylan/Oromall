services:
  # 1. Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: oromall_db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${PGDATABASE:-oromall}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oromall"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Serveur Backend API
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: oromall_backend
    restart: always
    environment:
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres_secure_pass_2026}
      PGDATABASE: ${PGDATABASE:-oromall}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  # 3. Frontend Web React (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oromall_frontend
    restart: always
    depends_on:
      - backend

volumes:
  pgdata:
